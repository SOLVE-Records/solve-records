<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<!-- Vorlage für dev/og/generate.py. {{…}} wird vom Skript ersetzt (Farben aus styles.css :root). -->
<style>
  @font-face { font-family: 'Bodoni Moda'; font-style: italic; font-weight: 700; src: url('{{fontdir}}/bodoni-moda-latin-700-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 700; src: url('{{fontdir}}/bodoni-moda-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Oswald'; font-weight: 300; src: url('{{fontdir}}/oswald-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Oswald'; font-weight: 400; src: url('{{fontdir}}/oswald-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('{{fontdir}}/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background-color: {{bg}};
    background-image:
      radial-gradient(ellipse 60% 70% at 22% 50%, rgba(255, 122, 46, 0.16), transparent 70%),
      radial-gradient(ellipse 50% 60% at 90% 10%, rgba(212, 162, 74, 0.10), transparent 70%),
      linear-gradient(180deg, {{bg}} 0%, {{bg-2}} 100%);
    color: {{cream}};
    font-family: 'Oswald', sans-serif;
  }
  .frame {
    position: absolute; inset: 28px;
    border: 1px solid {{brass-deep}};
    display: flex; align-items: center; gap: 64px;
    padding: 0 72px 0 64px;
  }
  .logo { flex: none; width: 300px; height: 300px; border-radius: 50%; overflow: hidden;
          box-shadow: 0 0 0 1px {{brass-deep}}, 0 0 80px rgba(255, 122, 46, 0.25); }
  .logo img { width: 100%; height: 100%; display: block; }
  .text { min-width: 0; flex: 1; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px;
             letter-spacing: 0.3em; text-transform: uppercase; color: {{brass}}; }
  .rule { width: 96px; height: 2px; background: {{brass}}; margin: 26px 0 22px; }
  h1 { font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 700;
       font-size: 104px; line-height: 1.02; color: {{brass-bright}}; letter-spacing: -0.01em; }
  .sub { margin-top: 26px; font-weight: 300; font-size: 36px; line-height: 1.3; color: {{cream}}; opacity: 0.85; }
  .site { position: absolute; right: 72px; bottom: 50px; font-family: 'JetBrains Mono', monospace;
          font-weight: 500; font-size: 18px; letter-spacing: 0.2em; color: {{brass}}; }
</style>
</head>
<body>
  <div class="frame">
    <div class="logo"><img src="{{logo}}" alt=""></div>
    <div class="text">
      <p class="eyebrow">{{eyebrow}}</p>
      <div class="rule"></div>
      <h1 id="t">{{title}}</h1>
      <p class="sub">{{sub}}</p>
    </div>
  </div>
  <p class="site">solverecords.de</p>
<script>
  // Titel verkleinern, bis er in höchstens zwei Zeilen und in die Textspalte passt
  window.fit = function () {
    var h = document.getElementById('t'), size = 104;
    while (size > 48 && (h.scrollWidth > h.clientWidth || h.getBoundingClientRect().height > size * 1.02 * 2 + 2)) {
      size -= 4; h.style.fontSize = size + 'px';
    }
  };
</script>
</body>
</html>
