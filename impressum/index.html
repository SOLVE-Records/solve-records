<style>
  /* Muster wie raumakustik/index.html. Farben, Schriften und Radius entsprechen styles.css. */
  :root {
    --bg: #0a0705;
    --bg-2: #15100a;
    --brass: #d4a24a;
    --brass-bright: #f4cc6f;
    --brass-deep: #8a5e1f;
    --brass-glow: #ffb347;
    --cream: #f3e7c8;
    --cream-soft: rgba(243, 231, 200, 0.75);
    --cream-mute: rgba(243, 231, 200, 0.45);
    --line: rgba(212, 162, 74, 0.22);
    --font-display: 'Bodoni Moda', 'Didot', 'Bodoni 72', serif;
    --font-sans: 'Oswald', 'Helvetica Neue', sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    --radius: 2px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(255, 122, 46, 0.12), transparent 70%);
    background-repeat: no-repeat;
    color: var(--cream);
    font-family: var(--font-sans);
    font-weight: 300;
    line-height: 1.6;
    padding-block: clamp(28px, 6vw, 64px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100vh;
  }

  .wrap { max-width: 900px; margin: 0 auto; }

  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--brass); margin: 0;
  }

  h1 {
    font-family: var(--font-display); font-style: italic; font-weight: 700;
    font-size: clamp(34px, 8vw, 64px); line-height: 1.05; color: var(--brass-bright);
    margin: 10px 0 0; text-wrap: balance; hyphens: auto; overflow-wrap: break-word;
  }

  section { margin-top: clamp(32px, 6vw, 52px); }
  h2 {
    font-family: var(--font-display); font-style: italic; font-weight: 700;
    font-size: clamp(22px, 4vw, 28px); line-height: 1.2; color: var(--brass-bright);
    margin: 0; text-wrap: balance;
  }

  .text p, .text address { margin: 12px 0 0; font-size: 16px; font-style: normal; color: var(--cream-soft); max-width: 62ch; overflow-wrap: break-word; }
  .text strong { font-weight: 500; color: var(--cream); }
  .text a { color: var(--cream); text-decoration: none; border-bottom: 1px solid var(--line); }
  .text a:hover { color: var(--brass-bright); border-color: var(--brass); }
  .text a:focus-visible { outline: 2px solid var(--brass-glow); outline-offset: 3px; }


  /* Footer: Impressum / Datenschutz, klein in Mono, Hover/Fokus wie die Rücklinks */
  .legal { margin: 48px auto 0; padding-top: 18px; border-top: 1px solid var(--line); }
  .legal-links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; }
  .legal-links a { color: var(--cream-soft); text-decoration: none; }
  .legal-links a:hover, .legal-links a:focus-visible { color: var(--brass-bright); }
  .legal-links a:focus-visible { outline: 2px solid var(--brass-glow); outline-offset: 3px; }
  .legal-links a[aria-current="page"] { color: var(--brass); }
</style>
</head>

<main class="wrap text">
  <header>

    <address>
      <strong>Michael Solf</strong><br>
      Solve Records (Studio, privat betrieben)<br>
      Kapellenweg 5<br>
      78315 Radolfzell
    </address>
  </section>

  <section aria-labelledby="kontakt">
    <h2 id="kontakt">Kontakt</h2>
    <!-- PRÜFEN: § 5 DDG verlangt Angaben für eine schnelle elektronische Kontaktaufnahme und unmittelbare Kommunikation. Laut Vorgabe steht hier nur die E-Mail; die Telefonnummer von der Startseite könnte ergänzt werden. -->
    <p>E-Mail: <a href="mailto:solfmichael5@gmail.com">solfmichael5@gmail.com</a></p>
  </section>

  <section aria-labelledby="verantwortlich">
    <h2 id="verantwortlich">Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h2>
    <p>Michael Solf, Anschrift wie oben.</p>
  </section>
</main>

<footer class="wrap legal">
  <nav class="legal-links" aria-label="Rechtliches">
    <a href="../impressum/" aria-current="page">Impressum</a>
    <a href="../datenschutz/">Datenschutz</a>
  </nav>
</footer>

</body>
