<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="glassBody" cx="40%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="#fff7e0" stop-opacity=".4"/>
      <stop offset="25%"  stop-color="#ffd89c" stop-opacity=".48"/>
      <stop offset="55%"  stop-color="#ff9a4a" stop-opacity=".58"/>
      <stop offset="85%"  stop-color="#c2521a" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#1a0a02" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="brassSocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fae3a8"/>
      <stop offset="20%" stop-color="#f4cc6f"/>
      <stop offset="50%" stop-color="#d4a24a"/>
      <stop offset="80%" stop-color="#8a5e1f"/>
      <stop offset="100%" stop-color="#4a2f10"/>
    </linearGradient>
    <linearGradient id="brassRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe8a8"/>
      <stop offset="50%" stop-color="#d4a24a"/>
      <stop offset="100%" stop-color="#5a3a14"/>
    </linearGradient>
    <linearGradient id="filament" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff8c4"/>
      <stop offset="40%"  stop-color="#ffd47a"/>
      <stop offset="75%"  stop-color="#ff8a3a"/>
      <stop offset="100%" stop-color="#d44210"/>
    </linearGradient>
    <linearGradient id="anode" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2a1a0a"/>
      <stop offset="50%"  stop-color="#5a3a18"/>
      <stop offset="100%" stop-color="#1a0a02"/>
    </linearGradient>
    <radialGradient id="getter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#3a3a40"/>
      <stop offset="60%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <filter id="hotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="oTube" viewBox="0 0 100 100" overflow="visible">
      <!-- ===== INNERE HALOS ===== -->
      <ellipse cx="50" cy="50" rx="48" ry="46" fill="#ff7a2e" opacity=".25" filter="url(#hotGlow)"/>
      <ellipse cx="50" cy="48" rx="32" ry="30" fill="#ffb066" opacity=".22" filter="url(#hotGlow)"/>

      <!-- ===== GLASKOLBEN ===== -->
      <!-- Hauptform - leicht asymmetrisch wie ein echter mundgeblasener Kolben -->
      <path d="M 22 48 Q 22 17 50 13.5 Q 78 17 78 48 Q 78 72 70 82 L 30 82 Q 22 72 22 48 Z"
            fill="url(#glassBody)" stroke="url(#brassRim)" stroke-width="1.4"/>

      <!-- Unterer dunkler Rand am Glas-Sockel-Übergang -->
      <path d="M 30 81.5 Q 30 80 32 80 L 68 80 Q 70 80 70 81.5 L 70 82 L 30 82 Z"
            fill="#1a0a02" opacity=".5"/>

      <!-- ===== METALL-SOCKEL ===== -->
      <rect x="26" y="80" width="48" height="10" fill="url(#brassSocket)" rx="1"/>
      <!-- Oberer Glanzrand des Sockels -->
      <rect x="26" y="80" width="48" height="1.2" fill="#ffeaad" opacity=".7"/>
      <rect x="26" y="81.2" width="48" height=".4" fill="#fff5d6" opacity=".5"/>
      <!-- Mittlere Rille -->
      <rect x="28" y="84.5" width="44" height=".4" fill="#3a1a05" opacity=".6"/>
      <rect x="28" y="85" width="44" height=".3" fill="#fae3a8" opacity=".3"/>
      <!-- Unterer Schattenrand -->
      <rect x="26" y="88" width="48" height="2" fill="#1a0a02" opacity=".55"/>
      <rect x="26" y="89.5" width="48" height=".5" fill="#000" opacity=".7"/>
      <!-- Stempel-Aussparung in der Mitte -->
      <rect x="38" y="82.3" width="24" height="2" fill="none" stroke="#3a1a05" stroke-width=".25" opacity=".5" rx=".3"/>

      <!-- Auflage-Schatten unter dem Sockel -->
      <ellipse cx="50" cy="91.2" rx="24" ry=".8" fill="#000" opacity=".4" filter="url(#hotGlow)"/>

      <!-- ===== PINS (dezent unter Sockel) ===== -->
      <g fill="url(#brassRim)" stroke="#3a1a05" stroke-width=".15" opacity=".75">
        <rect x="34" y="90" width="1.4" height="3.2" rx=".2"/>
        <rect x="40" y="90" width="1.4" height="3.6" rx=".2"/>
        <rect x="46" y="90" width="1.4" height="3.8" rx=".2"/>
        <rect x="52.6" y="90" width="1.4" height="3.8" rx=".2"/>
        <rect x="58.6" y="90" width="1.4" height="3.6" rx=".2"/>
        <rect x="64.6" y="90" width="1.4" height="3.2" rx=".2"/>
      </g>
      <!-- Pin-Highlights -->
      <g fill="#fff5d6" opacity=".4">
        <rect x="34.2" y="90.3" width=".2" height="2.2"/>
        <rect x="40.2" y="90.3" width=".2" height="2.4"/>
        <rect x="46.2" y="90.3" width=".2" height="2.6"/>
        <rect x="52.8" y="90.3" width=".2" height="2.6"/>
        <rect x="58.8" y="90.3" width=".2" height="2.4"/>
        <rect x="64.8" y="90.3" width=".2" height="2.2"/>
      </g>

      <!-- ===== MICA-DISTANZSCHEIBEN ===== -->
      <ellipse cx="50" cy="32" rx="19" ry="1.8" fill="#8a6a3a" opacity=".55"/>
      <ellipse cx="50" cy="32" rx="19" ry="1.8" fill="none" stroke="#d4a24a" stroke-width=".25" opacity=".6"/>
      <ellipse cx="50" cy="32" rx="14" ry="1" fill="#5a3a18" opacity=".4"/>
      <ellipse cx="50" cy="74" rx="19" ry="1.8" fill="#8a6a3a" opacity=".55"/>
      <ellipse cx="50" cy="74" rx="19" ry="1.8" fill="none" stroke="#d4a24a" stroke-width=".25" opacity=".6"/>

      <!-- ===== HALTERUNGS-DRÄHTE (vertikale Stäbe) ===== -->
      <line x1="32" y1="32" x2="32" y2="74" stroke="#3a2810" stroke-width=".5" opacity=".85"/>
      <line x1="32.4" y1="32" x2="32.4" y2="74" stroke="#fae3a8" stroke-width=".15" opacity=".4"/>
      <line x1="68" y1="32" x2="68" y2="74" stroke="#3a2810" stroke-width=".5" opacity=".85"/>
      <line x1="68.4" y1="32" x2="68.4" y2="74" stroke="#fae3a8" stroke-width=".15" opacity=".4"/>

      <!-- ===== ANODENKASTEN ===== -->
      <g filter="url(#softGlow)">
        <!-- Hauptkasten -->
        <rect x="36" y="34" width="28" height="40" fill="url(#anode)" stroke="#0a0502" stroke-width=".4" rx=".4"/>
        <!-- Vertikale Gitterstreben -->
        <g stroke="#0a0502" stroke-width=".22" opacity=".75">
          <line x1="40" y1="36" x2="40" y2="72"/>
          <line x1="44" y1="36" x2="44" y2="72"/>
          <line x1="48" y1="36" x2="48" y2="72"/>
          <line x1="52" y1="36" x2="52" y2="72"/>
          <line x1="56" y1="36" x2="56" y2="72"/>
          <line x1="60" y1="36" x2="60" y2="72"/>
        </g>
        <!-- Horizontale Gitterstreben -->
        <g stroke="#0a0502" stroke-width=".18" opacity=".5">
          <line x1="36" y1="42" x2="64" y2="42"/>
          <line x1="36" y1="50" x2="64" y2="50"/>
          <line x1="36" y1="58" x2="64" y2="58"/>
          <line x1="36" y1="66" x2="64" y2="66"/>
        </g>
        <!-- Obere Highlight-Kante -->
        <rect x="36" y="34" width="28" height=".8" fill="#a87a3a" opacity=".7"/>
        <!-- Linke Kante -->
        <rect x="36" y="34" width=".5" height="40" fill="#8a5a28" opacity=".5"/>
      </g>

      <!-- ===== HEIZFADEN GLÜHEN ===== -->
      <!-- Großes inneres Glühen -->
      <rect x="37" y="36" width="26" height="36" fill="#ff7a2e" opacity=".35" filter="url(#hotGlow)"/>
      <!-- Hellere Mitte -->
      <rect x="40" y="38" width="20" height="32" fill="#ffb347" opacity=".4"/>
      <!-- Heizfäden (zwei parallele Zickzack-Drähte) -->
      <g filter="url(#softGlow)">
        <path d="M 42 40 L 48 46 L 42 52 L 48 58 L 42 64 L 48 70"
              fill="none" stroke="url(#filament)" stroke-width="1.4"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 58 40 L 52 46 L 58 52 L 52 58 L 58 64 L 52 70"
              fill="none" stroke="url(#filament)" stroke-width="1.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Hellster zentraler Glühpunkt -->
      <ellipse cx="50" cy="54" rx="9" ry="17" fill="#fff3a0" opacity=".45" filter="url(#hotGlow)"/>
      <ellipse cx="50" cy="54" rx="4" ry="11" fill="#fff8d4" opacity=".6"/>
      <!-- Punktuelle Highlights an Heizfaden-Spitzen -->
      <circle cx="42" cy="46" r=".7" fill="#fff8d4" opacity=".7"/>
      <circle cx="58" cy="46" r=".7" fill="#fff8d4" opacity=".7"/>
      <circle cx="42" cy="58" r=".7" fill="#fff8d4" opacity=".7"/>
      <circle cx="58" cy="58" r=".7" fill="#fff8d4" opacity=".7"/>

      <!-- ===== GETTER-SPIEGEL OBEN ===== -->
      <ellipse cx="50" cy="22" rx="19" ry="5.5" fill="url(#getter)" opacity=".75"/>
      <ellipse cx="50" cy="21" rx="18" ry="4.5" fill="none" stroke="#7a7a82" stroke-width=".25" opacity=".6"/>
      <!-- Reflexion auf Getter -->
      <ellipse cx="44" cy="19.5" rx="5" ry="1.2" fill="#b0b0b8" opacity=".55"/>
      <ellipse cx="44" cy="19" rx="2" ry=".4" fill="#e0e0e8" opacity=".6"/>

      <!-- ===== GLAS-REFLEXIONEN (mehrschichtig für Tiefe) ===== -->
      <!-- Großer Glanz oben links -->
      <path d="M 26 38 Q 25 20 40 14" fill="none" stroke="#fff7e0" stroke-width="2.5" opacity=".75" stroke-linecap="round"/>
      <!-- Sekundärer Reflex links daneben -->
      <path d="M 30 32 Q 30 24 38 19" fill="none" stroke="#fff7e0" stroke-width="1" opacity=".4" stroke-linecap="round"/>
      <!-- Längsreflexion links -->
      <path d="M 27 48 Q 26 60 29 74" fill="none" stroke="#fff7e0" stroke-width="1.4" opacity=".4" stroke-linecap="round"/>
      <!-- Schmaler Reflex rechts -->
      <path d="M 74 38 Q 76 60 72 78" fill="none" stroke="#fff7e0" stroke-width=".7" opacity=".3" stroke-linecap="round"/>
      <!-- Top-Highlight (Glanzpunkt oben) -->
      <ellipse cx="44" cy="14.5" rx="6" ry="1.2" fill="#fff7e0" opacity=".6"/>
      <ellipse cx="44" cy="14" rx="3" ry=".5" fill="#ffffff" opacity=".55"/>
      <!-- Subtile Reflexion am Sockel-Glas-Übergang -->
      <path d="M 28 78 Q 50 79.5 72 78" fill="none" stroke="#fff7e0" stroke-width=".5" opacity=".25"/>
    </symbol>
  </defs>

  <!-- Großer warmer Halo HINTER dem Wordmark, in Hauptkoordinaten
       Tube-Mitte: x=415, y=320-280/2+10=190 (etwas nach oben verschoben)
       Eigentlich Mitte des Glaskolbens: y=68 + 280*0.5 = 208 -->
  <defs>
    <filter id="megaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>
  <ellipse cx="407" cy="210" rx="240" ry="190" fill="#ff7a2e" opacity=".45" filter="url(#megaGlow)"/>
  <ellipse cx="407" cy="210" rx="160" ry="125" fill="#ffb066" opacity=".4" filter="url(#megaGlow)"/>

  <!-- WORDMARK SOLVE -->
  <text x="640" y="320"
        font-family="Bodoni Moda, Bodoni 72, Didot, serif"
        font-weight="900" font-size="320" fill="#f3e7c8"
        text-anchor="middle">S<tspan fill="transparent">O</tspan>LVE</text>
  <!-- Tube: Sockel-Unterkante auf Baseline (y=320) der Buchstaben
       Im Symbol viewBox: Sockel-Unterkante y=90 (von 100) = 90%
       Bei width=280: 280*0.90 = 252
       y_pos = 320 - 252 = 68 -->
  <use href="#oTube" x="267" y="68" width="280" height="280"/>

  <!-- RECORDS -->
  <line x1="380" y1="400" x2="500" y2="400" stroke="#d4a24a" stroke-width="1.2" opacity=".7"/>
  <text x="640" y="416"
        font-family="Oswald, Helvetica Neue, sans-serif"
        font-weight="300" font-size="42" fill="#d4a24a"
        text-anchor="middle" letter-spacing="32">RECORDS</text>
  <line x1="780" y1="400" x2="900" y2="400" stroke="#d4a24a" stroke-width="1.2" opacity=".7"/>
</svg>
