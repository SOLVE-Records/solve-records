<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="glassBody" cx="40%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="#fff7e0" stop-opacity=".4"/>
      <stop offset="25%"  stop-color="#ffd89c" stop-opacity=".48"/>
      <stop offset="55%"  stop-color="#ff9a4a" stop-opacity=".58"/>
      <stop offset="85%"  stop-color="#c2521a" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#1a0a02" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="brassSocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fae3a8"/>
      <stop offset="20%" stop-color="#f4cc6f"/>
      <stop offset="50%" stop-color="#d4a24a"/>
      <stop offset="80%" stop-color="#8a5e1f"/>
      <stop offset="100%" stop-color="#4a2f10"/>
    </linearGradient>
    <linearGradient id="brassRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe8a8"/>
      <stop offset="50%" stop-color="#d4a24a"/>
      <stop offset="100%" stop-color="#5a3a14"/>
    </linearGradient>
    <linearGradient id="filament" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff8c4"/>
      <stop offset="40%"  stop-color="#ffd47a"/>
      <stop offset="75%"  stop-color="#ff8a3a"/>
      <stop offset="100%" stop-color="#d44210"/>
    </linearGradient>
    <linearGradient id="anode" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2a1a0a"/>
      <stop offset="50%"  stop-color="#5a3a18"/>
      <stop offset="100%" stop-color="#1a0a02"/>
    </linearGradient>
    <radialGradient id="getter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#3a3a40"/>
      <stop offset="60%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <filter id="hotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="oTube" viewBox="0 0 100 100">
      <ellipse cx="50" cy="50" rx="48" ry="46" fill="#ff7a2e" opacity=".22" filter="url(#hotGlow)"/>
      <ellipse cx="50" cy="48" rx="32" ry="30" fill="#ffb066" opacity=".18" filter="url(#hotGlow)"/>
      <path d="M 22 48 Q 22 18 50 14 Q 78 18 78 48 Q 78 72 70 82 L 30 82 Q 22 72 22 48 Z"
            fill="url(#glassBody)" stroke="url(#brassRim)" stroke-width="1.4"/>
      <rect x="26" y="80" width="48" height="10" fill="url(#brassSocket)" rx="1"/>
      <rect x="26" y="80" width="48" height="1.5" fill="#fff5d6" opacity=".55"/>
      <rect x="26" y="87.5" width="48" height="2" fill="#1a0a02" opacity=".55"/>
      <rect x="28" y="84" width="44" height=".5" fill="#3a1a05" opacity=".5"/>
      <rect x="40" y="82.5" width="20" height="2" fill="none" stroke="#3a1a05" stroke-width=".3" opacity=".4" rx=".3"/>
      <ellipse cx="50" cy="96" rx="20" ry="1.5" fill="#000" opacity=".4" filter="url(#hotGlow)"/>
      <g fill="url(#brassRim)" stroke="#3a1a05" stroke-width=".3">
        <rect x="32" y="90" width="2" height="5" rx=".3"/>
        <rect x="38" y="90" width="2" height="5.5" rx=".3"/>
        <rect x="44" y="90" width="2" height="6" rx=".3"/>
        <rect x="54" y="90" width="2" height="6" rx=".3"/>
        <rect x="60" y="90" width="2" height="5.5" rx=".3"/>
        <rect x="66" y="90" width="2" height="5" rx=".3"/>
      </g>
      <g fill="#fff5d6" opacity=".55">
        <rect x="32.2" y="90.5" width=".3" height="3.5"/>
        <rect x="38.2" y="90.5" width=".3" height="4"/>
        <rect x="44.2" y="90.5" width=".3" height="4.5"/>
        <rect x="54.2" y="90.5" width=".3" height="4.5"/>
        <rect x="60.2" y="90.5" width=".3" height="4"/>
        <rect x="66.2" y="90.5" width=".3" height="3.5"/>
      </g>
      <ellipse cx="50" cy="32" rx="18" ry="2" fill="#8a6a3a" opacity=".5"/>
      <ellipse cx="50" cy="32" rx="18" ry="2" fill="none" stroke="#d4a24a" stroke-width=".3" opacity=".7"/>
      <ellipse cx="50" cy="74" rx="18" ry="2" fill="#8a6a3a" opacity=".5"/>
      <ellipse cx="50" cy="74" rx="18" ry="2" fill="none" stroke="#d4a24a" stroke-width=".3" opacity=".7"/>
      <g filter="url(#softGlow)">
        <rect x="36" y="34" width="28" height="40" fill="url(#anode)" stroke="#1a0a02" stroke-width=".4" rx=".5"/>
        <g stroke="#0a0502" stroke-width=".25" opacity=".8">
          <line x1="40" y1="36" x2="40" y2="72"/>
          <line x1="44" y1="36" x2="44" y2="72"/>
          <line x1="48" y1="36" x2="48" y2="72"/>
          <line x1="52" y1="36" x2="52" y2="72"/>
          <line x1="56" y1="36" x2="56" y2="72"/>
          <line x1="60" y1="36" x2="60" y2="72"/>
        </g>
        <rect x="36" y="34" width="28" height="1" fill="#8a5a28" opacity=".7"/>
        <rect x="36" y="34" width=".7" height="40" fill="#8a5a28" opacity=".5"/>
      </g>
      <rect x="37" y="36" width="26" height="36" fill="#ff7a2e" opacity=".3" filter="url(#hotGlow)"/>
      <rect x="40" y="38" width="20" height="32" fill="#ffb347" opacity=".35"/>
      <g filter="url(#softGlow)">
        <path d="M 42 40 L 48 46 L 42 52 L 48 58 L 42 64 L 48 70" fill="none" stroke="url(#filament)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 58 40 L 52 46 L 58 52 L 52 58 L 58 64 L 52 70" fill="none" stroke="url(#filament)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <ellipse cx="50" cy="54" rx="9" ry="16" fill="#fff3a0" opacity=".4" filter="url(#hotGlow)"/>
      <ellipse cx="50" cy="54" rx="4" ry="10" fill="#fff8d4" opacity=".55"/>
      <line x1="32" y1="32" x2="32" y2="74" stroke="#5a3a18" stroke-width=".4" opacity=".7"/>
      <line x1="68" y1="32" x2="68" y2="74" stroke="#5a3a18" stroke-width=".4" opacity=".7"/>
      <ellipse cx="50" cy="22" rx="18" ry="5" fill="url(#getter)" opacity=".7"/>
      <ellipse cx="50" cy="21" rx="17" ry="4" fill="none" stroke="#5a5a60" stroke-width=".3" opacity=".6"/>
      <ellipse cx="44" cy="20" rx="4" ry="1.2" fill="#a0a0a8" opacity=".5"/>
      <path d="M 26 38 Q 25 22 38 16" fill="none" stroke="#fff7e0" stroke-width="2.4" opacity=".7" stroke-linecap="round"/>
      <path d="M 28 50 Q 27 60 30 72" fill="none" stroke="#fff7e0" stroke-width="1.3" opacity=".35" stroke-linecap="round"/>
      <path d="M 74 38 Q 75 60 72 76" fill="none" stroke="#fff7e0" stroke-width=".7" opacity=".25" stroke-linecap="round"/>
      <ellipse cx="44" cy="15" rx="6" ry="1.2" fill="#fff7e0" opacity=".55"/>
    </symbol>
  </defs>

  <!-- WORDMARK SOLVE -->
  <text x="640" y="320"
        font-family="Bodoni Moda, Bodoni 72, Didot, serif"
        font-weight="900" font-size="320" fill="#f3e7c8"
        text-anchor="middle">S<tspan fill="transparent">O</tspan>LVE</text>
  <!-- Tube zentriert zwischen S und L (gemessen: S endet 290, L beginnt 539, Mitte=415)
       Width=240, x=415-120=295, y=320-240*0.90=104 -->
  <use href="#oTube" x="295" y="104" width="240" height="240"/>

  <!-- RECORDS -->
  <line x1="380" y1="400" x2="500" y2="400" stroke="#d4a24a" stroke-width="1.2" opacity=".7"/>
  <text x="640" y="416"
        font-family="Oswald, Helvetica Neue, sans-serif"
        font-weight="300" font-size="42" fill="#d4a24a"
        text-anchor="middle" letter-spacing="32">RECORDS</text>
  <line x1="780" y1="400" x2="900" y2="400" stroke="#d4a24a" stroke-width="1.2" opacity=".7"/>
</svg>
